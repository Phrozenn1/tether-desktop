[package]
name = "tether-desktop"
version = "1.0.0"
edition = "2021"

[dependencies]
libadwaita = { version = "0.9", features = ["v1_6"] }
gtk4 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
notify-rust = "4.11"
dirs = "5.0"
rfd = "0.18.0"
rodio = "0.20"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
