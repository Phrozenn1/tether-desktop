name: Windows WinUI

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - core/**
      - windows/Tether.WinUI/**
      - .github/workflows/windows-winui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-winui:
    name: Build Windows WinUI preview
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and publish WinUI application
        run: |
          cargo build --manifest-path core/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild windows/Tether.WinUI/Tether.WinUI.csproj /restore /target:Publish /property:Configuration=Release /property:RuntimeIdentifier=win-x64 /property:SelfContained=true /property:PublishDir=tether-windows/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path tether-windows)) { throw "WinUI publish output was not created." }
          Compress-Archive -Path tether-windows/* -DestinationPath tether-windows-winui-preview-x86_64.zip -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: tether-windows-winui-preview
          path: tether-windows-winui-preview-x86_64.zip
