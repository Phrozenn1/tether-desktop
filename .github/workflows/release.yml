name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag to attach assets to (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output_file: tether-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            output_file: Tether-macos.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgtk-4-dev libadwaita-1-dev

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install gtk4 libadwaita pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix gtk4)/lib/pkgconfig:$(brew --prefix libadwaita)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release

      # macOS: create .app bundle and .dmg image
      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "Tether.app/Contents/MacOS"
          mkdir -p "Tether.app/Contents/Resources"
          cp target/release/tether-desktop "Tether.app/Contents/MacOS/tether"
          chmod +x "Tether.app/Contents/MacOS/tether"
          cat << 'EOF' > Tether.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>tether</string>
              <key>CFBundleIdentifier</key>
              <string>com.phrozenn.tether</string>
              <key>CFBundleName</key>
              <string>Tether</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "Tether" -srcfolder "Tether.app" -ov -format UDZO Tether-macos.dmg

      # Linux: package binary into .tar.gz
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp target/release/tether-desktop tether
          tar -czvf tether-linux-x86_64.tar.gz tether

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_file }}
          path: ${{ matrix.output_file }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: ${{ matrix.output_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
