name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag to attach assets to (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.tar.gz, .deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libgtk-4-dev libadwaita-1-dev libasound2-dev alien

      - name: Build release binary
        run: cargo build --release

      - name: Package Linux Tarball
        run: |
          mkdir -p tether-linux
          cp target/release/tether-desktop tether-linux/tether
          cp data/org.tether.Tether.desktop tether-linux/
          cp assets/tether.svg tether-linux/
          cp data/org.tether.Tether.metainfo.xml tether-linux/
          cp LICENSE README.md tether-linux/
          tar -czvf tether-linux-x86_64.tar.gz -C tether-linux .

      - name: Package Debian (.deb)
        run: |
          curl -sSL -O https://github.com/kornelski/cargo-deb/releases/download/v3.8.0/cargo-deb_3.8.0-1_amd64.deb
          sudo dpkg -i cargo-deb_3.8.0-1_amd64.deb
          cargo deb --no-build

      - name: Package RPM (.rpm)
        run: |
          sudo alien -r -c --bump=0 target/debian/*.deb
          mkdir -p target/rpm
          mv *.rpm target/rpm/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            tether-linux-x86_64.tar.gz
            target/debian/*.deb
            target/rpm/*.rpm

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            tether-linux-x86_64.tar.gz
            target/debian/*.deb
            target/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS dependencies
        run: |
          brew install gtk4 libadwaita pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix gtk4)/lib/pkgconfig:$(brew --prefix libadwaita)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release

      - name: Package macOS DMG
        run: |
          mkdir -p "Tether.app/Contents/MacOS"
          mkdir -p "Tether.app/Contents/Resources"
          cp target/release/tether-desktop "Tether.app/Contents/MacOS/tether"
          chmod +x "Tether.app/Contents/MacOS/tether"
          cat << 'EOF' > Tether.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>tether</string>
              <key>CFBundleIdentifier</key>
              <string>org.tether.Tether</string>
              <key>CFBundleName</key>
              <string>Tether</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.3.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "Tether" -srcfolder "Tether.app" -ov -format UDZO Tether-macos.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tether-macos.dmg
          path: Tether-macos.dmg

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: Tether-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows GTK (.exe / .zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 & Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            zip

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Windows ZIP
        run: |
          mkdir -p tether-windows
          cp target/release/tether-desktop.exe tether-windows/tether.exe
          cp target/release/tether-desktop.exe tether.exe
          ldd target/release/tether-desktop.exe | grep /ucrt64/bin/ | awk '{print $3}' | xargs -I {} cp {} tether-windows/ || true
          mkdir -p tether-windows/share/glib-2.0/schemas
          cp -r /ucrt64/share/glib-2.0/schemas/* tether-windows/share/glib-2.0/schemas/ 2>/dev/null || true
          zip -r tether-windows-x86_64.zip tether-windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            tether-windows-x86_64.zip
            tether.exe

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: |
            tether-windows-x86_64.zip
            tether.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-winui-preview:
    name: Build Windows WinUI preview
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native Tether core
        run: cargo build --manifest-path core/Cargo.toml --release

      - name: Publish WinUI application
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE 'tether-windows'
          msbuild windows/Tether.WinUI/Tether.WinUI.csproj /restore /target:Publish /property:Configuration=Release /property:RuntimeIdentifier=win-x64 /property:SelfContained=true "/property:PublishDir=$publishPath\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path tether-windows)) { throw "WinUI publish output was not created." }
          Compress-Archive -Path tether-windows/* -DestinationPath tether-windows-winui-preview-x86_64.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tether-windows-winui-preview
          path: tether-windows-winui-preview-x86_64.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: tether-windows-winui-preview-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    name: Build Flatpak (.flatpak)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: org.tether.Tether.yml
          bundle: tether.flatpak
          cache: false
          run-tests: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tether.flatpak
          path: tether.flatpak

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: tether.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
